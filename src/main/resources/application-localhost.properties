spring.application.name=bookstore-batch

## Configuration for connecting to PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/bookstore
spring.datasource.username=postgres
spring.datasource.password=bookstore_pwd

## To control how Hibernate automatically manages the database structure (schema) when the application starts
spring.jpa.hibernate.ddl-auto=update

## Enable SQL logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE