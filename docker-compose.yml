services:
  postgres:
    image: postgres:16-alpine # Good practice: always use a specific, lightweight version
    container_name: bookstore-batch-postgress
    restart: always
    environment:
      POSTGRES_PASSWORD: bookstore_pwd
      POSTGRES_DB: bookstore
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookstore"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ftp-server:
    image: garethflowers/ftp-server
    container_name: bookstore-batch-ftp
    environment:
      - FTP_USER=bookstore
      - FTP_PASS=bookstore123
      # Address advertised for passive FTP
      - PUBLIC_IP=ftp-server
      - PASV_MIN_PORT=40000
      - PASV_MAX_PORT=40009
    ports:
      - "20-21:20-21/tcp"
      - "40000-40009:40000-40009/tcp"
    volumes:
      - ./ftp_data:/home/bookstore
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "netstat -lnt | grep ':21' >/dev/null" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  bookstore-batch:
    image: bookstore-batch
    container_name: bookstore-batch
    build:
      context: .
      dockerfile: Dockerfile  # uses the file to generate the compiled app of bookstore-batch
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      ftp-server:
        condition: service_healthy

    environment:
      # Inject these into your application.properties / application.yml
      # Postgres
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/bookstore
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=bookstore_pwd
      # FTP
      - FTP_HOST=ftp-server
      - FTP_PORT=21
      - FTP_USERNAME=bookstore
      - FTP_PASSWORD=bookstore123
    develop:
      watch:
        # Watch your compiled classes folder for changes
        # --- FOR GRADLE ---
        - action: rebuild
          path: src
        - action: rebuild
          path: build.gradle

volumes:
  postgres-data:
